name: VNC Curadoria cinematografica (privado)
# Caminho CANONICO da triagem de clipes. Entrada: edite run/curate.json e faça push.
#   {"episode":"E02","mode":"select|confirm|release|probe","dry_run":false,"as_episode":"","force_reselect":false,"release_run":"","nonce":"x"}
# Unico workflow (junto da ingestao de voz) com escrita: grava memoria (ledger), registro, selecao, manifesto e cache de MEDIDAS (sem midia).
# Nao publica, nao gasta, nao gera voz. Escritas concorrentes: concurrency exclusivo + push sem force (nao-fast-forward falha sem perder dados).
on:
  push:
    branches: ["main"]
    paths: ["run/curate.json"]
permissions:
  contents: write
concurrency:
  group: vnc-curate
  cancel-in-progress: false
jobs:
  curate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest "imageio-ffmpeg==0.6.0" "pillow==12.3.0" numpy
      - name: Visao local (CLIP, CPU, gratis)
        run: python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu && python -m pip install --disable-pip-version-check transformers
      - name: Config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("run/curate.json"))
          print("episode=" + c["episode"]); print("mode=" + c.get("mode", "select")); print("dry=" + ("1" if c.get("dry_run") else "0"))
          print("as_ep=" + c.get("as_episode", "")); print("force=" + ("1" if c.get("force_reselect") else "0")); print("release_run=" + c.get("release_run", ""))
          PY
      - name: Testes (travas, memoria, selecao, curadoria)
        run: python -m pytest -q -p no:cacheprovider tests/test_vnc_gates.py tests/test_vnc_style.py tests/test_vnc_curate.py tests/test_vnc_memory.py tests/test_vnc_select.py tests/test_vnc_plan.py tests/test_vnc_sources.py tests/test_vnc_vision.py
      - name: Preflight
        run: python -m agents.vnc_gates curate-preflight "${{ steps.cfg.outputs.episode }}"
      - name: Curadoria
        id: run
        env:
          VNC_CURATE_MODE: ${{ steps.cfg.outputs.mode }}
          VNC_CURATE_DRY: ${{ steps.cfg.outputs.dry }}
          VNC_CURATE_AS: ${{ steps.cfg.outputs.as_ep }}
          VNC_FORCE_RESELECT: ${{ steps.cfg.outputs.force }}
          VNC_RELEASE_RUN: ${{ steps.cfg.outputs.release_run }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set +e
          python -m agents.vnc_curate "${{ steps.cfg.outputs.episode }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Persistir memoria e manifesto (so se nao for dry-run)
        if: steps.cfg.outputs.dry == '0'
        run: |
          rm -f contracts/*.lock
          git config user.name "vnc-curate"; git config user.email "vnc-curate@users.noreply.github.com"
          git add contracts episodes data
          if git diff --cached --quiet; then echo "nada a persistir"; exit 0; fi
          git commit -q -m "curadoria ${{ steps.cfg.outputs.episode }} (${{ steps.cfg.outputs.mode }}): memoria/manifesto run ${{ github.run_id }}"
          git push -q origin HEAD:main
      - name: Persistir so cache de medidas e impressoes legadas (dry-run)
        if: steps.cfg.outputs.dry == '1'
        run: |
          rm -f contracts/*.lock
          git config user.name "vnc-curate"; git config user.email "vnc-curate@users.noreply.github.com"
          git add data contracts/vnc_media_ledger_v1.json
          if git diff --cached --quiet; then echo "nada a persistir"; exit 0; fi
          git commit -q -m "curadoria (dry-run): cache de medidas e impressoes digitais legadas run ${{ github.run_id }}"
          git push -q origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curadoria-${{ steps.cfg.outputs.episode }}-${{ github.run_id }}
          path: /tmp/curate_out/
          retention-days: 14
      - name: Resultado
        run: exit ${{ steps.run.outputs.code }}
