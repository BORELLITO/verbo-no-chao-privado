name: VNC Midia publica (Cloudinary)
# Entrada: run/media.json {"mode":"check|upload","episodes":["E03",...],"nonce":"..."}. Envia o mp4 final a hospedagem gratuita para o agendador buscar. Nao publica nada em rede social. Sem cron.
on:
  push:
    branches: ["main"]
    paths: ["run/media.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: vnc-media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fonte dos mp4 (branch de recarga, so a pasta backfill)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: vnc/backfill-drive-20261122
          path: fonte
          sparse-checkout: backfill
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Artefatos dos episodios com run indicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          for ep, run in json.load(open("run/media.json")).get("runs", {}).items():
              assert ep.startswith("E") and str(run).isdigit()
              subprocess.run(["gh", "run", "download", str(run), "-R", "${{ github.repository }}", "-n", "vnc-build", "-D", f"art/{ep}"], check=True)
          PY
      - run: python -m pip install --disable-pip-version-check requests
      - name: Midia
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VNC_MEDIA_SRC: fonte/backfill
          VNC_MEDIA_ART: art
        run: |
          MODE="$(python3 -c 'import json;m=json.load(open("run/media.json")).get("mode","check");assert m in ("check","upload");print(m)')"
          python3 -m agents.vnc_media "$MODE"
