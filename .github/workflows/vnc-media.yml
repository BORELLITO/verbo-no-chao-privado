name: VNC Midia publica (Cloudinary)
# Entrada: run/media.json {"mode":"check|upload|check_capa|upload_capa|verify_remoto|upload_seguro","episodes":["E03",...],"nonce":"..."}. Envia o mp4 final a hospedagem gratuita para o agendador buscar. Nao publica nada em rede social. Sem cron.
on:
  push:
    branches: ["main"]
    paths: ["run/media.json"]
permissions:
  contents: read
  actions: read
concurrency:
  group: vnc-media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Artefatos dos episodios com run indicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          cfg = json.load(open("run/media.json"))
          for ep, run in cfg.get("runs", {}).items():
              assert ep.startswith("E") and str(run).isdigit()
              subprocess.run(["gh", "run", "download", str(run), "-R", "${{ github.repository }}", "-n", "vnc-build", "-D", f"art/{ep}"], check=True)
          if cfg.get("mode", "").endswith("_capa"):
              # capa pode vir de outro run (ex.: run so de capa): "runs_capa"; senao, do mesmo run do video
              for ep, run in (cfg.get("runs_capa") or cfg.get("runs", {})).items():
                  assert ep.startswith("E") and str(run).isdigit()
                  subprocess.run(["gh", "run", "download", str(run), "-R", "${{ github.repository }}", "-n", "vnc-cover", "-D", f"art/{ep}-capa"], check=True)
          PY
      - name: ffmpeg (so para a copia segura de audio)
        run: |
          if [ "$(python3 -c 'import json;print(json.load(open("run/media.json")).get("mode",""))')" = "upload_seguro" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
      - run: python -m pip install --disable-pip-version-check requests
      - name: Midia
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          VNC_MEDIA_SRC: fonte/backfill
          VNC_MEDIA_ART: art
        run: |
          MODE="$(python3 -c 'import json;m=json.load(open("run/media.json")).get("mode","check");assert m in ("check","upload","check_capa","upload_capa","verify_remoto","upload_seguro");print(m)')"
          python3 -m agents.vnc_media "$MODE"
