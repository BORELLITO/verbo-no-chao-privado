name: VNC Runflow central (privado)
# Entrada unica: edite run/runflow.json e faça push. Etapas: gates -> build -> sync -> cover.
# Nada publica, nada gasta, nada gera voz. Falha em qualquer trava bloqueia as etapas seguintes.
on:
  push:
    branches: ["main"]
    paths: ["run/runflow.json"]
permissions:
  contents: read
concurrency:
  group: vnc-runflow
  cancel-in-progress: false
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      episode: ${{ steps.cfg.outputs.episode }}
      selection: ${{ steps.cfg.outputs.selection }}
      stages: ${{ steps.cfg.outputs.stages }}
      timing_override: ${{ steps.cfg.outputs.timing_override }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest pillow numpy
      - name: Config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("run/runflow.json"))
          print("episode=" + c["episode"]); print("selection=" + c.get("selection", "")); print("stages=" + ",".join(c["stages"])); print("timing_override=" + c.get("timing_override", ""))
          PY
      - name: Testes das travas
        run: python -m pytest -q -p no:cacheprovider tests/test_vnc_gates.py tests/test_vnc_align.py tests/test_vnc_style.py tests/test_vnc_pipeline_gate.py tests/test_vnc_script_review.py tests/test_vnc_cover_gate.py
      - name: Preflight (clipes, trilha, workflows, proibicoes)
        run: |
          MUSIC="$(python -c 'import json;print(json.load(open("run/runflow.json")).get("music",""))')"
          python -m agents.vnc_gates preflight "${{ steps.cfg.outputs.episode }}" "${{ steps.cfg.outputs.selection }}" ${MUSIC:+--music "$MUSIC"}
      - name: Agente-mestre (roteiro, voz, postagem)
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0"
          python -m agents.vnc_pipeline_gate pre "${{ steps.cfg.outputs.episode }}"
  build:
    needs: gates
    if: contains(needs.gates.outputs.stages, 'build')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0" "pillow==12.3.0" numpy
      - name: Montagem
        run: |
          python -m pip install --disable-pip-version-check faster-whisper
          VNC_TIMING_OVERRIDE="${{ needs.gates.outputs.timing_override }}" VNC_EPISODE="${{ needs.gates.outputs.episode }}" VNC_FINAL=1 VNC_SELECTION="${{ needs.gates.outputs.selection }}" python -m agents.vnc_master_build
      - name: Agente-mestre (video, legenda, musica, postagem)
        run: python -m agents.vnc_pipeline_gate post "${{ needs.gates.outputs.episode }}" /tmp/master/report.json
  cover:
    needs: gates
    if: contains(needs.gates.outputs.stages, 'cover')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0" "pillow==12.3.0" numpy
      - run: |
          VNC_EPISODE="${{ needs.gates.outputs.episode }}" python -m agents.vnc_cover
  sync:
    needs: gates
    if: contains(needs.gates.outputs.stages, 'sync')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check faster-whisper imageio-ffmpeg
      - run: |
          if [ "${{ needs.gates.outputs.episode }}" != "E01" ]; then echo "VNC_SYNC_NA: episodios novos usam Whisper small x base (conferencia dentro do build); checagem independente do contrato so existe para o E01"; exit 0; fi
          python -m agents.e01_sync_check
