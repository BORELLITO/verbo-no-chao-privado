name: E01 capa (privado)
on:
  push:
    branches: ["main"]
    paths: ["run/cover_trigger.txt"]
permissions:
  contents: read
jobs:
  cover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0" "pillow==12.3.0" numpy
      - run: python -m agents.e01_cover
