name: Verbo no Chão — E01 master preview (repositório PRIVADO, logs privados)
on:
  push:
    branches: ["main"]
    paths: ["run/trigger.txt"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0" "pillow==12.3.0" numpy
      - name: Build E01 master preview
        run: |
          export VNC_E01_AUDIO_URL="$(cat run/audio_link.txt)"
          VNC_SELECTION=contracts/e01_v4_scene_clip_selection_landscape.json python -m agents.e01_master_build
