name: VNC Envio ao Drive (privado)
# Roda sozinho quando o Runflow termina com sucesso. Envia mp4, .srt, capa e legendas de postagem para a pasta certa do Drive do dono.
# Nao publica nada nas redes; o Drive e privado. Sem os segredos GDRIVE_* ele so avisa e sai sem erro.
on:
  workflow_run:
    workflows: ["VNC Runflow central (privado)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID do run do Runflow (artefatos duram 3 dias)"
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: vnc-drive
  cancel-in-progress: false
jobs:
  drive:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Episodio do run
        id: ep
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("episode=" + json.load(open("run/runflow.json"))["episode"])
          PY
      - name: Baixar artefatos do Runflow
        run: |
          mkdir -p art/build art/cover
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n vnc-build -D art/build || echo "sem artefato vnc-build (run sem etapa build)"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n vnc-cover -D art/cover || echo "sem artefato vnc-cover (run sem etapa cover)"
          ls -la art/build art/cover
      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check "imageio-ffmpeg==0.6.0" "pillow==12.3.0" numpy opencv-python-headless
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone
      - name: Enviar ao Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python -m agents.vnc_drive "${{ steps.ep.outputs.episode }}" art/build art/cover
