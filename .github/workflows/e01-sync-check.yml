name: E01 sync check (privado)
on:
  push:
    branches: ["main"]
    paths: ["run/sync_trigger.txt"]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check faster-whisper "av>=14"
      - run: python -m agents.e01_sync_check
